spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      default-filters:
        - AddResponseHeader=X-Gateway-Log, Active

      routes:
        # --- BOOKING SERVICE ---
        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/room/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: bookingCircuit
                fallbackUri: forward:/fallback/booking

        # --- ROOM SERVICE ---
        - id: room-service
          uri: lb://ROOM-SERVICE
          predicates:
            - Path=/api/v1/rooms/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        # --- GUEST SERVICE ---
        - id: guest-service
          uri: lb://GUEST-SERVICE
          predicates:
            - Path=/api/v1/guest/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        # --- LOYALTY SERVICE ---
        - id: loyalty-service
          uri: lb://LOYALTY-SERVICE
          predicates:
            - Path=/api/v1/loyalty/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        # --- STAFF SERVICE ---
        - id: staff-service
          uri: lb://STAFF-SERVICE
          predicates:
            - Path=/api/v1/staffs/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

        # --- SERVICE MANAGEMENT ---
        - id: service-management
          uri: lb://SERVICE-MANAGEMENT
          predicates:
            - Path=/api/v1/service/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"

  # Fixed Redis Indentation (2 spaces only)
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty.http.client: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health, info, tracing, circuitbreakers

